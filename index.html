<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4f0">
<title>旅のしおり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: one column. Lock screen → "next up" hero with countdown → day-by-day timeline → stay cards. */
:root{
  --bg:#f6f4f0; --surface:#ffffff; --fg:#22252e; --muted:#6b6f7c; --line:#e3e0d9;
  --accent:#c2571a; --accent-soft:#f6e3d6; --done:#2f7d5b; --done-soft:#e1f1e8; --ink:#1d3b6e;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17181d; --surface:#21232a; --fg:#ecebe7; --muted:#a3a5ae; --line:#33353e;
  --accent:#ef8a4c; --accent-soft:#3a2a20; --done:#62c193; --done-soft:#1f3329; --ink:#9db8ea; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--font-head);font-size:1.7rem;margin:0;text-wrap:balance}
h2{font-family:var(--font-head);font-size:1.1rem;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
button,.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.4}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
[hidden]{display:none!important}

/* lock */
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lock form{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.lock label{font-weight:700}
.lock input[type=password]{font:inherit;font-size:1rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.lock .row{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.lock .err{color:var(--accent);font-size:.9rem;margin:0}
.lock .primary{padding:12px;font-size:1rem;justify-content:center}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* next up */
.next{background:var(--ink);color:#fff;border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
@media (prefers-color-scheme: dark){.next{color:#11131a}}
.next .eyebrow{font-size:.75rem;letter-spacing:.08em;opacity:.8}
.next .what{font-family:var(--font-head);font-size:1.25rem;text-wrap:balance}
.next .when{font-size:.95rem;opacity:.9}
.next .count{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.next .count small{font-size:.9rem;font-weight:500;opacity:.85;margin-left:4px}

/* timeline */
.day{display:flex;flex-direction:column;gap:8px}
.day h3{font-family:var(--font-head);font-size:1rem;margin:0;color:var(--accent)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:4.4em 1fr;gap:4px 12px}
.ev.past{opacity:.5}
.ev.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ev .t{font-weight:700;font-variant-numeric:tabular-nums}
.ev .t small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.ev .title{font-weight:700}
.ev .route{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.ev .detail{font-size:.88rem;overflow-wrap:anywhere}
.ev .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 8px;margin-right:6px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}

/* stays */
.stays{display:flex;flex-direction:column;gap:12px}
.stay{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stay .nights{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stay .name{font-family:var(--font-head);font-size:1.15rem}
.stay .city{font-size:.8rem;color:var(--muted)}
.stay .addr{font-size:.9rem;overflow-wrap:anywhere}
.stay .note{font-size:.85rem;color:var(--muted)}
.stay .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

/* driver view */
.driver{position:fixed;inset:0;z-index:20;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;gap:24px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow:auto}
.driver .dname{font-size:clamp(2rem,9vw,3.4rem);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.driver .daddr{font-size:clamp(1.2rem,5.5vw,2rem);line-height:1.35;overflow-wrap:anywhere}
.driver .dphone{font-size:clamp(1.2rem,5.5vw,1.8rem);font-weight:700;font-variant-numeric:tabular-nums}
.driver .please{font-size:1rem;color:#555}
.driver button{align-self:flex-start;font-size:1rem;background:#111;color:#fff;border-color:#111}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 16px;font-size:.9rem;z-index:30}
.foot{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="lock" id="lock">
    <div>
      <h1>旅のしおり</h1>
      <p class="sub">パスワードを入れると開きます</p>
    </div>
    <form id="lockForm" autocomplete="off">
      <label for="pw">パスワード</label>
      <input type="password" id="pw" name="pw" autocomplete="current-password" required>
      <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="font-weight:400">この端末では10日間パスワードなしで開く</label></div>
      <p class="err" id="err" hidden>パスワードが違います。もう一度入れてください。</p>
      <button type="submit" class="primary" id="openBtn">開く</button>
    </form>
  </section>

  <main id="app" hidden>
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="period"></p>
      </div>
      <button type="button" id="lockBtn">ロック</button>
    </div>

    <section class="next" id="next" aria-live="polite"></section>

    <section class="day" style="gap:12px">
      <h2>移動（飛行機・バス・列車）</h2>
      <p class="sub" style="margin:0">時刻はその場所の現地時間です（インドは日本より3時間半遅い）</p>
      <div id="timeline" style="display:flex;flex-direction:column;gap:16px"></div>
    </section>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h2>宿</h2>
      <div class="stays" id="stays"></div>
    </section>

    <p class="foot">住所を押すとGoogleマップが開きます。「ドライバーに見せる」で、宿の名前と住所を大きく表示できます。</p>
  </main>
</div>

<div class="driver" id="driver" hidden role="dialog" aria-modal="true" aria-labelledby="dname">
  <div class="please">Please take me to:</div>
  <div class="dname" id="dname"></div>
  <div class="daddr" id="daddr"></div>
  <div class="dphone" id="dphone"></div>
  <button type="button" id="closeDriver">閉じる</button>
</div>
<div class="toast" id="toast" hidden></div>

const KEY = "trip-shiori-pw";
const REMEMBER_MS = 10 * 24 * 60 * 60 * 1000; // 10日間

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  const data = JSON.parse(new TextDecoder().decode(plain));
  CRYPTO_KEY = key;
  return data;
}
let CRYPTO_KEY = null;
const fileUrls = {};
async function openFile(btn){
  const [ei, fi] = btn.getAttribute("data-file").split(":").map(Number);
  const f = DATA.events[ei].files[fi];
  const id = ei + ":" + fi;
  if (!fileUrls[id]){
    btn.disabled = true; const label = btn.textContent; btn.textContent = "読み込み中…";
    try{
      const res = await fetch(f.file, {cache:"no-store"});
      if (!res.ok) throw new Error(res.status);
      const ct = new Uint8Array(await res.arrayBuffer());
      const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(f.iv)}, CRYPTO_KEY, ct);
      fileUrls[id] = URL.createObjectURL(new Blob([plain], {type:"application/pdf"}));
    }catch(e){
      btn.disabled = false; btn.textContent = label;
      toast("読み込めませんでした。電波を確認してください");
      return;
    }
    btn.disabled = false; btn.textContent = label;
  }
  // 準備できたら、開くリンクと保存リンクに置き換える（タップで確実に開くため）
  const wrap = document.createElement("span");
  wrap.style.display = "contents";
  const name = f.label.replace(/[（(].*$/, "") + ".pdf";
  wrap.innerHTML = `<a class="btn primary" href="${fileUrls[id]}" target="_blank" rel="noopener">${esc(f.label.replace(/（PDF）/, ""))}を開く</a><a class="btn" href="${fileUrls[id]}" download="${esc(name)}">保存</a>`;
  btn.replaceWith(wrap);
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const TZ = {jst:"Asia/Tokyo", ist:"Asia/Kolkata"};
const TZLABEL = {jst:"日本時間", ist:"インド時間"};

function fmt(iso, tz, opts){
  return new Intl.DateTimeFormat("ja-JP", Object.assign({timeZone:TZ[tz]}, opts)).format(new Date(iso));
}
const hm = (iso,tz) => fmt(iso, tz, {hour:"2-digit", minute:"2-digit", hour12:false});
const dayKey = (iso,tz) => fmt(iso, tz, {month:"numeric", day:"numeric", weekday:"short"});
const tzOf = e => e.tz || (e.start.endsWith("+09:00") ? "jst" : "ist");

let DATA = null, timer = null;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 1600);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("コピーしました"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); toast("コピーしました"); }catch(_){ toast("長押しでコピーしてください"); }
    ta.remove();
  }
}
function showDriver(s){
  $("dname").textContent = s.name;
  $("daddr").textContent = s.address;
  $("dphone").textContent = s.phone || "";
  $("driver").hidden = false;
  $("closeDriver").focus();
}

function stayActs(s){
  let h = `<a class="btn" href="${mapUrl(s.name + ", " + s.address)}" target="_blank" rel="noopener">地図</a>`;
  if (s.phone){
    const tel = s.phone.replace(/[^+\d]/g, "");
    h += `<a class="btn" href="tel:${tel}">電話</a><button type="button" data-copy="${esc(s.phone)}">番号をコピー</button>`;
  }
  h += `<button type="button" data-copy="${esc(s.address)}">住所をコピー</button>`;
  if (s.booking) h += `<button type="button" data-copy="${esc(s.booking)}">予約ID ${esc(s.booking)}</button>`;
  h += `<button type="button" data-driver="${esc(s.id)}">ドライバーに見せる</button>`;
  return h;
}

function render(){
  $("title").textContent = DATA.title;
  $("period").textContent = DATA.period;
  document.title = DATA.title;
  const stays = Object.fromEntries(DATA.stays.map(s => [s.id, s]));

  // stays
  $("stays").innerHTML = DATA.stays.map(s => `
    <article class="stay">
      <div class="nights">${esc(s.nights)}</div>
      <div class="name">${esc(s.name)}</div>
      <div class="city">${esc(s.city)}</div>
      <a class="addr" href="${mapUrl(s.name + ", " + s.address)}" target="_blank" rel="noopener">${esc(s.address)}</a>
      ${s.phone ? `<div class="addr">${esc(s.phone)}</div>` : ""}
      <div class="note">${esc(s.note)}</div>
      <div class="acts">${stayActs(s)}</div>
    </article>`).join("");

  // timeline grouped by local day
  const groups = [];
  DATA.events.forEach((e, i) => {
    const tz = tzOf(e), k = dayKey(e.start, tz);
    let g = groups[groups.length - 1];
    if (!g || g.k !== k){ g = {k, items:[]}; groups.push(g); }
    g.items.push({e, i, tz});
  });
  $("timeline").innerHTML = groups.map(g => `
    <div class="day">
      <h3>${esc(g.k)}</h3>
      ${g.items.map(({e, i, tz}) => {
        const endTz = e.endTz || tz;
        const kind = {flight:"飛行機", bus:"バス", train:"列車", stay:"宿", note:"メモ"}[e.kind] || "";
        const s = e.stay ? stays[e.stay] : null;
        let acts = "";
        if (e.mapFrom) acts += `<a class="btn" href="${mapUrl(e.mapFrom)}" target="_blank" rel="noopener">乗り場の地図</a>`;
        if (e.mapTo) acts += `<a class="btn" href="${mapUrl(e.mapTo)}" target="_blank" rel="noopener">降り場の地図</a>`;
        (e.files || []).forEach((f, fi) => acts += `<button type="button" data-file="${i}:${fi}">${esc(f.label)}</button>`);
        (e.copy || []).forEach(c => acts += `<button type="button" data-copy="${esc(c)}">${esc(c)} をコピー</button>`);
        if (s) acts += `<a class="btn" href="${mapUrl(s.name + ", " + s.address)}" target="_blank" rel="noopener">地図</a><button type="button" data-driver="${esc(s.id)}">ドライバーに見せる</button>`;
        return `
        <div class="ev" data-i="${i}">
          <div class="t">${hm(e.start, tz)}${e.approx ? "<small>ごろ</small>" : ""}${e.end ? `<small>→ ${hm(e.end, endTz)}${endTz !== tz ? "（" + TZLABEL[endTz] + "）" : ""}</small>` : ""}<small>${TZLABEL[tz]}</small></div>
          <div class="body">
            <div class="title"><span class="tag">${kind}</span>${esc(e.title)}</div>
            ${e.from ? `<div class="route">${esc(e.from)} → ${esc(e.to)}</div>` : ""}
            ${e.detail ? `<div class="detail">${esc(e.detail)}</div>` : ""}
            ${acts ? `<div class="acts">${acts}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");

  tick();
  clearInterval(timer); timer = setInterval(tick, 30000);
}

function tick(){
  const now = Date.now();
  let next = null, current = null;
  DATA.events.forEach((e, i) => {
    const st = Date.parse(e.start), en = e.end ? Date.parse(e.end) : st;
    const el = document.querySelector(`.ev[data-i="${i}"]`);
    if (!el) return;
    el.classList.toggle("past", en < now);
    const isNow = e.end && st <= now && now <= en;
    el.classList.toggle("now", !!isNow);
    if (isNow) current = {e, i};
    if (!next && st > now) next = {e, i};
  });

  const box = $("next");
  const pick = current || next;
  if (!pick){
    box.innerHTML = `<div class="eyebrow">旅の予定</div><div class="what">おかえりなさい！全部の予定が終わりました</div>`;
    return;
  }
  const e = pick.e, tz = tzOf(e);
  if (current){
    const left = Date.parse(e.end) - now;
    box.innerHTML = `<div class="eyebrow">いま移動中</div><div class="what">${esc(e.title)}</div>
      <div class="when">到着 ${hm(e.end, e.endTz || tz)}（${TZLABEL[e.endTz || tz]}）</div>
      <div class="count">${dur(left)}<small>で到着</small></div>`;
  } else {
    const left = Date.parse(e.start) - now;
    box.innerHTML = `<div class="eyebrow">次の移動</div><div class="what">${esc(e.title)}</div>
      <div class="when">${dayKey(e.start, tz)} ${hm(e.start, tz)}${e.approx ? "ごろ" : ""}（${TZLABEL[tz]}）</div>
      <div class="count">あと ${dur(left)}</div>`;
  }
}
function dur(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d > 0) return `${d}日 ${h}時間`;
  if (h > 0) return `${h}時間 ${mm}分`;
  return `${mm}分`;
}

document.addEventListener("click", ev => {
  const fb = ev.target.closest("[data-file]");
  if (fb){ openFile(fb); return; }
  const c = ev.target.closest("[data-copy]");
  if (c){ copy(c.getAttribute("data-copy")); return; }
  const d = ev.target.closest("[data-driver]");
  if (d){ const s = DATA.stays.find(x => x.id === d.getAttribute("data-driver")); if (s) showDriver(s); }
});
$("closeDriver").addEventListener("click", () => { $("driver").hidden = true; });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $("driver").hidden = true; });

async function unlock(pw, remember){
  try{
    DATA = await decrypt(pw);
  }catch(e){
    return false;
  }
  if (remember){ try{ localStorage.setItem(KEY, JSON.stringify({pw, exp: Date.now() + REMEMBER_MS})); }catch(_){} }
  $("lock").hidden = true; $("app").hidden = false;
  render();
  return true;
}

$("lockForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("err").hidden = true; $("openBtn").disabled = true; $("openBtn").textContent = "開いています…";
  const ok = await unlock($("pw").value, $("remember").checked);
  $("openBtn").disabled = false; $("openBtn").textContent = "開く";
  if (!ok){ $("err").hidden = false; $("pw").select(); }
});
$("lockBtn").addEventListener("click", () => {
  try{ localStorage.removeItem(KEY); }catch(_){}
  DATA = null; CRYPTO_KEY = null; clearInterval(timer);
  Object.keys(fileUrls).forEach(k => { URL.revokeObjectURL(fileUrls[k]); delete fileUrls[k]; });
  $("app").hidden = true; $("lock").hidden = false;
  $("timeline").innerHTML = ""; $("stays").innerHTML = ""; $("next").innerHTML = "";
  $("pw").value = ""; $("pw").focus();
});

(async () => {
  let saved = null;
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && raw.pw && raw.exp > Date.now()) saved = raw.pw;
    else localStorage.removeItem(KEY);
  }catch(_){}
  if (saved && await unlock(saved, false)) return;
  $("pw").focus();
})();
</script>
</body>
</html>
